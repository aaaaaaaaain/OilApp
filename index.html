<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="apple-touch-icon" href="fuel.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="油耗記錄">
    <title>油耗 App</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- 在 CSS 之前先套用存下來的主題，避免開啟瞬間閃一下另一個顏色 -->
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <!-- ?v= 版本號：改版後手機（尤其是 iOS 主畫面捷徑）才不會繼續用舊的快取檔 -->
    <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
    <div class="header">
        <h1>油耗紀錄</h1>
        <div class="header-actions">
            <select id="vehicleSelect" class="vehicle-select" onchange="switchVehicle(this.value)" aria-label="切換車輛"></select>
            <button type="button" class="gear-btn" id="gearBtn" onclick="toggleSettings()" aria-label="設定">&#9881;</button>
        </div>
    </div>

    <div id="statsWrap">
        <!-- 收合後只留這一行，條碼與表單就能往上移 -->
        <div id="statsBar" class="stats-bar" style="display:none" onclick="toggleStats()">
            <div>
                <span class="stats-bar-main" id="statsBarMain">--</span>
                <span class="stats-bar-sub" id="statsBarSub"></span>
            </div>
            <span class="stats-chevron">&#9662;</span>
        </div>

        <div id="statsBody" onclick="toggleStats()">
            <div class="stats-grid">
                <div class="stat-card"><strong id="avgVal">0.00</strong><span>平均 km/L</span></div>
                <div class="stat-card"><strong id="countVal">0</strong><span>總筆數</span></div>
                <div class="stat-card"><strong id="lowVal">--</strong><span>歷史新低 km/L</span></div>
            </div>

            <div class="stats-grid" id="costStats" style="display:none">
                <div class="stat-card"><strong id="costTotalVal">--</strong><span>總油錢</span></div>
                <div class="stat-card"><strong id="avgCostVal">--</strong><span>平均花費</span></div>
                <div class="stat-card"><strong id="costPerKmVal">--</strong><span>每公里成本</span></div>
            </div>
        </div>
    </div>

    <!-- 主頁：圖表與歷史明細放在一起 -->
    <div id="s2" class="sec active">
        <div class="sec-title">油耗趨勢</div>
        <div class="stat-card chart-card">
            <canvas id="chart"></canvas>
            <div id="chartEmpty" class="chart-empty" style="display:none">還沒有可以畫的油耗資料</div>
        </div>
        <div class="group-hint">點一下線上的圓點看該次的日期時間、里程與花費。虛線是平均油耗。</div>

        <div class="sec-title list-title">歷史明細</div>
        <div class="ios-list" id="list"></div>
        <button onclick="exportXLS()" class="secondary-btn">📥 導出 Excel</button>
        <button onclick="clearAll()" class="danger-btn">重置資料</button>
    </div>

    <!-- 設定 -->
    <div id="s3" class="sec">
        <div class="settings-group">
            <div class="sec-title">車輛</div>
            <div class="ios-list" id="vehicleList"></div>
            <div class="group-hint">點車牌可改名。每台車的紀錄、統計與圖表分開計算。</div>
        </div>

        <div class="settings-group">
            <div class="sec-title">外觀</div>
            <div class="segmented" id="themeSeg">
                <button type="button" class="segment" id="themeSystem" onclick="applyTheme('system')">跟隨系統</button>
                <button type="button" class="segment" id="themeLight" onclick="applyTheme('light')">淺色</button>
                <button type="button" class="segment" id="themeDark" onclick="applyTheme('dark')">深色</button>
            </div>
        </div>

        <div class="settings-group">
            <div class="sec-title">載具</div>
            <div class="ios-list">
                <div class="ios-item">
                    <label for="carrierInput">載具代碼</label>
                    <div class="carrier-input-wrap">
                        <span class="carrier-prefix">/</span>
                        <input type="text" id="carrierInput" maxlength="7" placeholder="ABC1234"
                               inputmode="text" autocomplete="off" autocorrect="off"
                               autocapitalize="characters" spellcheck="false"
                               oninput="this.value=this.value.toUpperCase()" onchange="saveCarrier()">
                    </div>
                </div>
                <div class="ios-item link-row" onclick="generateBarcode()"><label>顯示條碼</label><span class="ios-value">&rsaquo;</span></div>
            </div>
            <div class="group-hint">填好即自動儲存。加油要掃的條碼固定在「新增」頁下方。</div>

            <div id="barcodeSection" class="barcode-section" style="display:none">
                <div class="barcode-card">
                    <svg id="carrierBarcode"></svg>
                    <div class="carrier-code-display" id="carrierCodeDisplay"></div>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <div class="sec-title">資料</div>
            <div class="ios-list">
                <div class="ios-item link-row" onclick="exportBackup()"><label>匯出備份檔</label><span class="ios-value">JSON</span></div>
                <div class="ios-item link-row" onclick="$('importFile').click()"><label>還原備份檔</label><span class="ios-value">選擇檔案</span></div>
            </div>
            <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
            <div class="group-hint">換手機或清除瀏覽資料前請先匯出，還原會取代目前全部紀錄。</div>
        </div>

        <div class="settings-group">
            <div class="sec-title">關於</div>
            <div class="ios-list">
                <div class="ios-item"><label>版本</label><span class="ios-value" id="appVersion">--</span></div>
            </div>
        </div>

        <button class="secondary-btn" onclick="tab(0)">完成</button>
    </div>

    <!-- 右下角新增鈕 -->
    <button type="button" class="fab" onclick="openAdd()" aria-label="新增紀錄">&#65291;</button>

    <!-- 新增紀錄：蓋滿整個畫面，開 App 會自動跳出 -->
    <div id="addSheet" class="sheet">
        <div class="sheet-inner">
            <div class="sheet-header">
                <div class="sheet-title">新增紀錄<span class="sheet-plate" id="sheetPlate"></span></div>
                <button type="button" class="sheet-close" onclick="closeAdd()" aria-label="關閉">&times;</button>
            </div>

        <div id="inlineBarcode" class="barcode-section" style="display:none">
            <div class="barcode-card">
                <svg id="inlineBarcodeImg"></svg>
                <div class="carrier-code-display" id="inlineCodeDisplay"></div>
            </div>
        </div>

        <div class="segmented mode-switch">
            <button type="button" class="segment active" id="mode0" onclick="setMode('trip')">直接輸入里程</button>
            <button type="button" class="segment" id="mode1" onclick="setMode('odo')">總公里數計算</button>
        </div>

        <div class="ios-list">
            <input type="hidden" id="editIdx" value="-1">
            <div class="ios-item"><label for="date">日期</label><input type="date" id="date" onchange="updateOdoHint()"></div>
            <div class="ios-item"><label for="time">時間</label><input type="time" id="time" onchange="updateOdoHint()"></div>
            <div class="ios-item" id="rowDistance"><label for="distance">里程 (km)</label><input type="number" id="distance" placeholder="0.0" inputmode="decimal" step="0.1" oninput="updateCostHint()"></div>
            <div class="ios-item" id="rowOdo" style="display:none"><label for="odo">總公里數 (km)</label><input type="number" id="odo" placeholder="0.0" inputmode="decimal" step="0.1" oninput="updateOdoHint(); updateCostHint()"></div>
            <div class="ios-item"><label for="liters">公升 (L)</label><input type="number" id="liters" placeholder="0.00" inputmode="decimal" step="0.01" oninput="updateOdoHint(); syncMoney('liters')"></div>
            <div class="ios-item"><label for="price">單價 (元/L)</label><input type="number" id="price" placeholder="選填" inputmode="decimal" step="0.1" oninput="syncMoney('price')"></div>
            <div class="ios-item"><label for="cost">金額 (元)</label><input type="number" id="cost" placeholder="選填" inputmode="decimal" step="1" oninput="syncMoney('cost')"></div>
        </div>
        <div id="odoHint" class="mode-hint" style="display:none"></div>
        <div id="costHint" class="mode-hint" style="display:none"></div>
        <button class="btn" onclick="save()">儲存數據</button>
        <button class="secondary-btn" id="cancelEditBtn" style="display:none" onclick="cancelEdit()">取消編輯</button>
        </div>
    </div>

    <script src="script.js?v=21"></script>
</body>
</html>
